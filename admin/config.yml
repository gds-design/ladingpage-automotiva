backend:
  name: github
  repo: gds-design/ladingpage-automotiva
  branch: main

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: "content"
    label: "Gerenciar Estoque"
    delete: false
    editor:
      preview: false
    files:
      - file: "data/vehicles.json"
        label: "Estoque de Carros"
        name: "vehicles_list"
        fields:
          - name: "vehicles"
            label: "Carros no Estoque"
            label_singular: "Carro"
            widget: "list"
            fields:
              - { label: "ID único (sem espaços)", name: "id", widget: "string" }
              - { label: "Nome do Veículo", name: "name", widget: "string" }
              - { label: "Imagem (Link ou Upload)", name: "image", widget: "image" }
              - { label: "Vendido?", name: "isSold", widget: "boolean", default: false }
              
              # Unified Specifications & Price
              - label: "Moeda"
                name: "currency"
                widget: "select"
                options:
                  - { label: "Real Brasileiro (BRL - R$)", value: "BRL" }
                  - { label: "Dólar Americano (USD - US$)", value: "USD" }
                  - { label: "Guarani Paraguaio (PYG - Gs)", value: "PYG" }
                default: "BRL"
                
              - { label: "Preço (Valor numérico limpo)", name: "price", widget: "number", value_type: "int" }
              
              - label: "Especificações do Veículo"
                name: "specs"
                widget: "object"
                fields:
                  - { label: "Ano/Modelo", name: "year", widget: "string" }
                  - { label: "Quilometragem (Apenas número)", name: "km", widget: "number", value_type: "int" }
                  - { label: "Câmbio / Transmissão", name: "transmission", widget: "string" }
